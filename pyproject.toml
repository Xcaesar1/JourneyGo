[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/app/domain/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
exclude = ["backend/app/agents/legacy/"]

[[tool.mypy.overrides]]
module = ["app.agents.legacy.*", "backend.app.agents.legacy.*"]
ignore_errors = true
