name: journeygo-staging

services:
  postgres:
    container_name: journeygo-postgres-staging

  redis:
    container_name: journeygo-redis-staging

  migrate:
    container_name: journeygo-migrate-staging

  data-init:
    container_name: journeygo-data-init-staging

  worker:
    container_name: journeygo-worker-staging

  trip-planner:
    container_name: journeygo-staging
    ports: !override
      - "127.0.0.1:17861:7860"
    volumes: !override
      - trip_data:/app/backend/data

volumes:
  trip_data:
    name: journeygo_staging_data
  postgres_data:
    name: journeygo_staging_postgres_data
  redis_data:
    name: journeygo_staging_redis_data
