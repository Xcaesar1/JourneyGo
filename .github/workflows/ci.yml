name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journeyops
          POSTGRES_PASSWORD: journeyops_ci
          POSTGRES_DB: journeyops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journeyops -d journeyops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Ruff on staged architecture
        run: python -m ruff check backend/app/agents/journey_graph backend/app/api/v2 backend/app/db backend/app/domain backend/app/workers backend/app/services/task_events.py backend/app/services/observability.py backend/app/services/guardrails.py backend/scripts backend/tests tests

      - name: Ruff critical checks on existing backend code
        run: python -m ruff check backend/app --select E9,F63,F7,F82

      - name: Mypy on typed contracts and deterministic services
        run: >-
          python -m mypy
          backend/app/domain
          backend/app/evaluation
          backend/app/services/replanning.py
          backend/app/services/routing

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://journeyops:journeyops_ci@localhost:5432/journeyops
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Initialize LangGraph checkpoints
        env:
          DATABASE_URL: postgresql+psycopg://journeyops:journeyops_ci@localhost:5432/journeyops
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: python -m backend.scripts.setup_langgraph_checkpoints

      - name: Pytest
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+psycopg://journeyops:journeyops_ci@localhost:5432/journeyops
          TEST_REDIS_URL: redis://localhost:6379/0
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: python -m pytest

      - name: Offline planner regression evaluation
        env:
          PYTHONPATH: .
        run: python -m backend.scripts.run_evaluation --minimum-pass-rate 0.75 --output artifacts/evaluation-report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: journeyops-offline-evaluation
          path: artifacts/evaluation-report.json

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
